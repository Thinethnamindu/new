<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp Web - Cyberpunk RGB Edition</title>
    <!-- Relative path for Android WebView / Capacitor compatibility -->
    <link rel="stylesheet" href="./style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <!-- Firebase App & Database SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        
        window.firebaseConfig = {
            apiKey: "AIzaSyD8-3t2_3YwNG39K8XlQoKsCZNTsOBuibw",
            authDomain: "whatsapp-clone-9b0a4.firebaseapp.com",
            projectId: "whatsapp-clone-9b0a4",
            storageBucket: "whatsapp-clone-9b0a4.appspot.com",
            messagingSenderId: "524924699585",
            appId: "1:524924699585:web:44763f53140dc1d15a6540",
            measurementId: "G-8T3CDL8D44"
        };
    </script>
</head>
<body>

    <!-- Email & Username Input Screen (Step 1) -->
    <div class="auth-screen" id="emailScreen">
        <div class="auth-card">
            <h2>Welcome to Chat</h2>
            <p>Enter your profile details to get started</p>
            
            <div class="profile-upload-container">
                <div class="profile-upload-box" id="profileUploadBox">
                    <img id="previewAvatar" src="" alt="" style="display:none;">
                    <span>Upload Avatar</span>
                </div>
                <input type="file" id="avatarFile" accept="image/*" style="display: none;">
            </div>

            <input type="text" id="usernameInput" class="auth-input" placeholder="Enter your name">
            <input type="email" id="emailInput" class="auth-input" placeholder="Enter your Gmail address">
            <button class="auth-btn" id="sendCodeBtn">Get Verification Code</button>
        </div>
    </div>

    <!-- OTP Verification Screen (Step 2) -->
    <div class="auth-screen" id="otpScreen" style="display: none;">
        <div class="auth-card">
            <h2>Verify Your Email</h2>
            <p id="otpMsg">Enter the 4-digit verification code sent to your email</p>
            <input type="text" id="otpInput" class="auth-input" placeholder="Enter 4-digit code" maxlength="4" style="text-align: center; letter-spacing: 8px; font-size: 20px;">
            <button class="auth-btn" id="verifyBtn">Verify & Login</button>
        </div>
    </div>

    <!-- Settings Modal / Screen -->
    <div class="auth-screen" id="settingsScreen" style="display: none; z-index: 150;">
        <div class="auth-card">
            <h2>Profile Settings</h2>
            <p>Update your profile photo and display name</p>
            
            <div class="profile-upload-container">
                <div class="profile-upload-box" id="settingsUploadBox">
                    <img id="settingsPreviewAvatar" src="" alt="Avatar">
                    <span>Change Photo</span>
                </div>
                <input type="file" id="settingsAvatarFile" accept="image/*" style="display: none;">
            </div>

            <input type="text" id="settingsUsernameInput" class="auth-input" placeholder="Enter new name">
            
            <div style="display: flex; gap: 10px;">
                <button class="auth-btn" id="saveSettingsBtn">Save Changes</button>
                <button class="auth-btn" id="closeSettingsBtn" style="background: rgba(255,255,255,0.1);">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Main Chat Interface -->
    <div class="chat-container" id="chatContainer" style="display: none;">
        
        <!-- Left Sidebar: Inbox List -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile-info">
                    <img id="myAvatar" class="user-avatar" src="" alt="My Avatar">
                    <h4 id="userDisplayProfile">My Name</h4>
                </div>
                <div class="sidebar-icons">
                    <i class="fas fa-cog" id="openSettingsBtn" title="Settings" style="cursor: pointer;"></i>
                    <i class="fas fa-comment-alt" title="Chats"></i>
                    <i class="fas fa-sign-out-alt" id="logoutBtn" title="Logout" style="cursor: pointer;"></i>
                </div>
            </div>

            <div class="search-box">
                <div class="search-input-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search or start new chat">
                </div>
            </div>

            <div class="chat-list" id="chatList">
                <!-- Dynamic users will load here -->
            </div>
        </div>

        <!-- Right Sidebar: Active Chat Area -->
        <div class="chat-main">
            <div class="chat-header">
                <div class="active-user-info">
                    <i class="fas fa-arrow-left back-btn" id="backToListBtn"></i>
                    <img id="activeChatAvatar" class="user-avatar" src="" alt="Avatar">
                    <div>
                        <h4 id="activeChatName">Select a chat</h4>
                        <span id="activeChatStatus" style="font-size: 12px; color: #94a3b8;">Online <span class="online-dot"></span></span>
                    </div>
                </div>
                <div class="sidebar-icons">
                    <i class="fas fa-video"></i>
                    <i class="fas fa-phone"></i>
                    <i class="fas fa-ellipsis-v"></i>
                </div>
            </div>

            <!-- Messages Box -->
            <div class="chat-messages" id="chatMessages">
                <!-- Messages will appear here -->
            </div>

            <!-- Input Area -->
            <div class="chat-input-area">
                <i class="far fa-face-smile"></i>
                <i class="fas fa-paperclip"></i>
                <div class="chat-input-wrapper">
                    <input type="text" id="messageInput" placeholder="Type a message...">
                </div>
                <button class="send-btn" id="sendBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>

    </div>

    <!-- Main App Script -->
    <script type="module" src="./script.js"></script>
</body>
</html>
